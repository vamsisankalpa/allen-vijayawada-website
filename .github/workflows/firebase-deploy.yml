name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v7

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: allen-vijayawada-website
          workload_identity_provider: projects/1013167891436/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-action-1388721683@allen-vijayawada-website.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project allen-vijayawada-website
